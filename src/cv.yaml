site_url: https://paparidar.github.io

photo: photo.jpg

about: |
  I'm a PhD candidate at TU Delft working on transport simulation of disease
  spread, based at the [Pandemic and Disaster Preparedness
  Centre](https://www.pandemicpreparedness.eu/). My background is in industrial
  and systems engineering and policy research, and the through-line across all
  of it is systems modelling: building things that make a complicated,
  badly-observed system legible enough to act on.

  Most of my current work asks a version of the same question — if a pathogen is
  moving through the world's airports and seaports, where would you have to be
  looking to notice in time? That turns into data pipelines stitching aviation,
  maritime, demographic and epidemiological sources together; System Dynamics,
  agent-based and network models on top of them; and risk-ranking frameworks
  that put flights, vessels and routes in an order someone can actually act on.
  The constraint I care about most is deployability: sparse data, noisy streams,
  regulatory requirements, and a decision-maker who needs to know why the model
  said what it said.

  I work with Amsterdam Airport Schiphol and the Port of Rotterdam, and I spend
  a good share of my time translating model output into policy briefs and
  stakeholder workshops. Outside that: cycling, coffee, long walks, museums.

