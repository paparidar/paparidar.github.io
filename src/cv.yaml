about: |
  I am a PhD candidate at TU Delft working on transport simulation of disease
  spread, based at the [Pandemic and Disaster Preparedness
  Centre](https://www.pandemicpreparedness.eu/). I trained first as an
  industrial and systems engineer, then as a policy researcher, and the thread
  running through all of it is systems modelling: building things that make a
  complicated, poorly observed system clear enough to act on.

  Most of my current work asks a version of the same question. If a pathogen is
  moving through the world's airports and seaports, where would you have to be
  looking to notice in time? In practice that becomes data pipelines that stitch
  aviation, maritime, demographic and epidemiological sources together,
  simulation and network models built on top of them, and ways of ranking
  flights, vessels and routes so that somebody can act on the answer. What I
  care about most is whether any of it survives contact with reality: sparse
  data, noisy streams, regulatory requirements, and a decision maker who needs
  to know why the model said what it said.

  Amsterdam Airport Schiphol and the Port of Rotterdam are the two case studies
  I keep coming back to. They are large, messy and reasonably well documented,
  and they fail in different enough ways to be worth studying side by side. A
  fair share of my time goes on turning model output into policy briefs and
  workshops for people who will never read the code. Away from all that:
  cycling, coffee, long walks, museums and galleries.

